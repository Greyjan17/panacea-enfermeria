const VITAL_RANGES = {
  pa:   {min:90, max:140, unit:"mmHg", label:"Presión Arterial", icon:"🫀", parse:v=>parseInt(v?.split("/")[0])},
  fc:   {min:60, max:100, unit:"lpm",  label:"Frec. Cardíaca",   icon:"💓"},

  peso: {unit:"kg", label:"Peso",  icon:"⚖"},
  talla:{unit:"m",  label:"Talla", icon:"📏"},
};

const getAlerta = (key, val) => {
  if (!val) return null;
  const r = VITAL_RANGES[key];
  if (!r || r.min===undefined) return null;
  const n = r.parse ? r.parse(val) : parseFloat(val);
  if (isNaN(n)) return null;
  if (n > r.max) return "alto";
  if (n < r.min) return "bajo";
  return "normal";
};

const triajeCriteria = reg => {
  const pa = VITAL_RANGES.pa.parse(reg.pa);
  const fc = parseFloat(reg.fc), temp = parseFloat(reg.temp);
  if (pa>180||pa<80||fc>130||fc<45||temp>39.5||temp<35) return "Rojo";
  if (pa>140||pa<90||fc>100||fc<60||temp>38||temp<36)   return "Amarillo";
  return "Verde";
};

  let a = 0;
  const sys = parseInt(pa?.split("/")?.[0]);
  if (!isNaN(sys)) { if(sys>140) a+=2; else if(sys>130) a++; }
  const p=parseFloat(peso), t=parseFloat(talla);
  if(p&&t){const imc=p/(t*t);if(imc>30)a+=2;else if(imc>25)a++;}
  if(parseFloat(met.glucosa_ayunas)>126)a+=3;else if(parseFloat(met.glucosa_ayunas)>100)a++;
  if(parseFloat(met.colesterol_total)>240)a+=2;else if(parseFloat(met.colesterol_total)>200)a++;
  if(parseFloat(met.trigliceridos)>200)a+=2;else if(parseFloat(met.trigliceridos)>150)a++;
  if(parseFloat(met.hdl)<40)a+=2;
  return a===0?"Verde":a<=3?"Amarillo":"Rojo";
};

async function dbGetAll() {
  const r = await fetch(`${SUPA_URL}/rest/v1/enfermeria_registros?order=created_at.desc`,{headers:SH});
  return r.ok ? r.json() : null;
}
async function dbUpsert(reg) {
  const row = {
    id:reg.id, fecha:reg.fecha, hora:reg.hora,
    nombre:reg.nombre, dni:reg.dni, edad:reg.edad,
    empresa:reg.empresa, cargo:reg.cargo, enfermera:reg.enfermera,
    motivo:reg.motivo, t_evol:reg.tEvol, sintomas:reg.sintomas,
    pa:reg.pa, fc:reg.fc, fr:reg.fr, temp:reg.temp,
    peso:reg.peso, talla:reg.talla,
    exposiciones:reg.exposiciones, tiempo:reg.tiempo, epps:reg.epps,
    lab_resumen:reg.labResumen, triaje:reg.triaje, estado:reg.estado,
    updated_at:new Date().toISOString(),
  };
  const r = await fetch(`${SUPA_URL}/rest/v1/enfermeria_registros`,{
    method:"POST", headers:{...SH,"Prefer":"resolution=merge-duplicates"}, body:JSON.stringify(row)
  });
  return r.ok;
}
async function dbDelete(id) {
  return (await fetch(`${SUPA_URL}/rest/v1/enfermeria_registros?id=eq.${id}`,{method:"DELETE",headers:SH})).ok;
}
async function dbUpsertMetabolico(row) {
  const r = await fetch(`${SUPA_URL}/rest/v1/medweb_metabolico`,{
    method:"POST", headers:{...SH,"Prefer":"resolution=merge-duplicates"},
    body:JSON.stringify({...row,updated_at:new Date().toISOString()})
  });
  return r.ok;
}

async function readB64(file) {
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
}
async function callClaudePDF(b64, prompt) {
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,
      messages:[{role:"user",content:[
        {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},
        {type:"text",text:prompt}
      ]}]
    })
  });
  const d = await r.json();
  return d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

      setLabFiles(prev=>prev.map((f,idx)=>idx===i?{...f,estado:"listo",texto}:f));
      return{name:file.name,estado:"listo",texto};
    }));
    const procesados=resultados.map((r,i)=>r.status==="fulfilled"?r.value:{name:files[i].name,estado:"error",texto:"No se pudo procesar."});
    const resumen=procesados.map(r=>`📄 ${r.name}:\n${r.texto}`).join("\n\n─────────\n\n");

                      <div style={{fontSize:10,color:C.textSoft}}>{r.fecha}</div>
                    </div>
                    <button onClick={e=>{e.stopPropagation();eliminarReg(r.id);}}
                      style={{background:C.redLight,border:`1px solid ${C.red}`,color:C.red,borderRadius:7,padding:"4px 9px",cursor:"pointer",fontSize:11,fontWeight:700,marginLeft:4}}>🗑</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* FORMULARIO */}
        {vista==="form"&&(
          <div>
            {/* STEPPER */}
            <div style={{display:"flex",marginBottom:20,background:C.white,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden"}}>
              {PASOS.map((p,i)=>(
                <div key={p.n} onClick={()=>setPaso(p.n)} style={{flex:1,padding:"9px 4px",textAlign:"center",cursor:"pointer",background:paso===p.n?C.blue:paso>p.n?C.teal+"22":"transparent",color:paso===p.n?"#fff":paso>p.n?C.teal:C.textSoft,borderRight:i<PASOS.length-1?`1px solid ${C.border}`:"none"}}>
                  <div style={{fontSize:16}}>{p.icon}</div>
                  <div style={{fontSize:10,fontWeight:700}}>{p.label}</div>
                  {paso>p.n&&<div style={{fontSize:9,color:C.teal}}>✓</div>}
                </div>
              ))}
            </div>

            {/* Triaje en tiempo real */}
            {(reg.pa||reg.fc||reg.temp)&&(
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",background:riskBg(triajeActual),border:`1px solid ${riskColor(triajeActual)}`,borderRadius:10,marginBottom:12}}>
                <span style={{fontSize:20}}>{triajeActual==="Rojo"?"🔴":triajeActual==="Amarillo"?"🟡":"🟢"}</span>
                <div>
                  <div style={{fontWeight:800,color:riskColor(triajeActual),fontSize:13}}>Triaje en tiempo real: {triajeActual}</div>
                  <div style={{fontSize:11,color:C.textSoft}}>Actualiza automáticamente con los signos vitales</div>
                </div>
              </div>
            )}

            {/* PASO 1 */}
            {paso===1&&(
              <>
                <Card title="Datos del Paciente" icon="👤" tag="IDENTIFICACIÓN" tagColor={C.blue} accent={C.blueLight}>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                    <Field label="Nombre completo" value={reg.nombre} onChange={v=>upd("nombre",v)} full placeholder="Apellidos y nombres"/>
                  </div>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                    <Field label="DNI"   value={reg.dni}   onChange={v=>upd("dni",v)}   placeholder="12345678"/>
                    <Field label="Edad"  value={reg.edad}  onChange={v=>upd("edad",v)}  type="number" placeholder="años"/>
                    <Field label="Fecha" value={reg.fecha} onChange={v=>upd("fecha",v)} type="date"/>
                    <Field label="Hora"  value={reg.hora}  onChange={v=>upd("hora",v)}  type="time"/>
                  </div>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                    <Field label="Empresa" value={reg.empresa}   onChange={v=>upd("empresa",v)}/>
                    <Field label="Cargo"   value={reg.cargo}     onChange={v=>upd("cargo",v)}/>
                  </div>
                  <Field label="Personal responsable" value={reg.enfermera} onChange={v=>upd("enfermera",v)}/>
                </Card>
                <Card title="Motivo de Consulta" icon="📋" tag="SUBJETIVO" tagColor={C.purple} accent={C.purpleLight}>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                    <Field label="Motivo principal" value={reg.motivo} onChange={v=>upd("motivo",v)} full placeholder="¿Por qué consulta hoy?"/>
                  </div>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                    <Field label="Tiempo de evolución" value={reg.tEvol}    onChange={v=>upd("tEvol",v)}    placeholder="Ej: 2 días"/>
                    <Field label="Síntomas asociados"  value={reg.sintomas} onChange={v=>upd("sintomas",v)} placeholder="Ej: fiebre, dolor"/>
                  </div>
                </Card>
              </>
            )}

            {/* PASO 2 */}
            {paso===2&&(
              <Card title="Signos Vitales" icon="📊" tag="OBJETIVO" tagColor={C.teal} accent={C.tealLight}>
                <div style={{background:"#FFF9E6",border:`1px solid ${C.amber}`,borderRadius:9,padding:"8px 12px",fontSize:12,color:"#7B4F00",marginBottom:12}}>
                  💡 <span style={{color:C.green,fontWeight:700}}>verde=normal</span> · <span style={{color:C.red,fontWeight:700}}>rojo=alto</span> · <span style={{color:C.blue,fontWeight:700}}>azul=bajo</span>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
                  {["pa","fc","fr","temp","peso","talla"].map(k=>(
                    <VitalBox key={k} vkey={k} value={reg[k]} onChange={v=>upd(k,v)}/>
                  ))}
                  <div style={{flex:1,minWidth:100,background:C.purpleLight,border:`2px solid ${C.purple}`,borderRadius:12,padding:10,display:"flex",flexDirection:"column",gap:3,alignItems:"center",justifyContent:"center"}}>
                    <div style={{fontSize:16}}>🧮</div>
                    <div style={{fontSize:9,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>IMC</div>
                    <div style={{fontSize:20,fontWeight:900,color:imcColor}}>{imc}</div>
                    <div style={{fontSize:9,color:imcColor,fontWeight:700}}>{imcLabel}</div>
                  </div>
                </div>
                <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                  <Field label="Clasificación triaje" value={reg.triaje||"Verde"} onChange={v=>upd("triaje",v)} type="select" options={["Verde","Amarillo","Rojo"]}/>
                  <div style={{paddingTop:18}}>
                    <span style={{background:riskColor(triajeActual),color:"#fff",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700}}>
                      {triajeActual==="Rojo"?"🔴":triajeActual==="Amarillo"?"🟡":"🟢"} Auto: {triajeActual}
                    </span>
                  </div>
                </div>
              </Card>
            )}

            {/* PASO 3 */}
            {paso===3&&(
              <Card title="Antecedentes Ocupacionales" icon="🏭" tag="RIESGO LABORAL" tagColor={C.amber} accent={C.amberLight}>
                <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                  <Field label="Exposiciones" value={reg.exposiciones} onChange={v=>upd("exposiciones",v)} full type="textarea" placeholder="Ruido, polvo, químicos, ergonómicos..."/>
                </div>
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                  <Field label="Tiempo de servicio" value={reg.tiempo} onChange={v=>upd("tiempo",v)} placeholder="Ej: 3 años"/>
                  <Field label="EPPs" value={reg.epps} onChange={v=>upd("epps",v)} placeholder="Ej: casco, guantes"/>
                </div>
              </Card>
            )}

            {/* PASO 4 */}
            {paso===4&&(
              <Card title="Resultados de Laboratorio" icon="🔬" tag="ANÁLISIS" tagColor={C.green} accent={C.greenLight}>
                <input ref={labRef} type="file" accept="application/pdf" multiple style={{display:"none"}} onChange={handleLabPDFs}/>
                <div onClick={()=>labRef.current?.click()} style={{border:`2px dashed ${C.blue}`,borderRadius:12,padding:"24px 20px",textAlign:"center",cursor:"pointer",background:C.blueLight,marginBottom:14}}>
                  <div style={{fontSize:32,marginBottom:6}}>📂</div>
                  <div style={{fontWeight:700,color:C.blue,fontSize:13}}>Clic para seleccionar PDFs</div>
                  <div style={{fontSize:11,color:C.textSoft,marginTop:3}}>Múltiples archivos · procesados en paralelo por IA</div>
                </div>
                {labLoading&&<div style={{background:C.amberLight,border:`1px solid ${C.amber}`,borderRadius:9,padding:"10px 14px",fontSize:13,color:"#7B4F00",marginBottom:12}}>⏳ Analizando PDFs con IA...</div>}
                {labFiles.length>0&&(
                  <div style={{marginBottom:12}}>
                    {labFiles.map((f,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:f.estado==="listo"?C.greenLight:f.estado==="error"?C.redLight:C.amberLight,borderRadius:7,marginBottom:5,border:`1px solid ${f.estado==="listo"?C.green:f.estado==="error"?C.red:C.amber}`}}>
                        <span>{f.estado==="listo"?"✅":f.estado==="error"?"❌":"⏳"}</span>
                        <span style={{fontSize:12,flex:1,fontWeight:600}}>{f.name}</span>
                        <span style={{fontSize:10,color:C.textSoft}}>{f.estado}</span>
                      </div>
                    ))}
                  </div>
                )}
                {reg.labDetalle?.map((d,i)=>(
                  <div key={i} style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",marginBottom:10}}>
                    <div style={{fontWeight:700,color:C.teal,fontSize:12,marginBottom:6}}>📄 {d.name}</div>
                    <div style={{fontSize:12,lineHeight:1.7,whiteSpace:"pre-wrap",color:C.text}}>{d.texto}</div>
                  </div>
                ))}
                {reg.labResumen&&<div style={{marginTop:8}}><Field label="✏ Editar / agregar notas" value={reg.labResumen} onChange={v=>upd("labResumen",v)} type="textarea" full/></div>}
              </Card>
            )}

            {/* PASO 5 */}
            {paso===5&&(
              <Card title="Parámetros Metabólicos" icon="🧪" tag="DASHBOARD" tagColor={C.purple} accent={C.purpleLight}>
                <div style={{background:C.blueLight,border:`1px solid ${C.blue}`,borderRadius:8,padding:"8px 12px",fontSize:11,color:C.blue,marginBottom:14,fontWeight:600}}>
                  💡 Estos datos se enviarán al <strong>Dashboard Metabólico</strong> del Dr. Ochoa en MEDWEB
                </div>
                <div style={{fontWeight:700,fontSize:11,color:C.textSoft,textTransform:"uppercase",marginBottom:8}}>Perfil Lipídico</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                  <InpNum label="Colesterol Total" value={met.colesterol_total} onChange={v=>updM("colesterol_total",v)} unit="mg/dL"/>
                  <InpNum label="HDL"              value={met.hdl}             onChange={v=>updM("hdl",v)}             unit="mg/dL"/>
                  <InpNum label="LDL"              value={met.ldl}             onChange={v=>updM("ldl",v)}             unit="mg/dL"/>
                  <InpNum label="VLDL"             value={met.vldl}            onChange={v=>updM("vldl",v)}            unit="mg/dL"/>
                  <InpNum label="Triglicéridos"    value={met.trigliceridos}   onChange={v=>updM("trigliceridos",v)}   unit="mg/dL"/>
                </div>
                <div style={{fontWeight:700,fontSize:11,color:C.textSoft,textTransform:"uppercase",marginBottom:8}}>Glucometría</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                  <InpNum label="Glucosa Ayunas" value={met.glucosa_ayunas} onChange={v=>updM("glucosa_ayunas",v)} unit="mg/dL"/>
                  <InpNum label="HbA1c"          value={met.hba1c}          onChange={v=>updM("hba1c",v)}          unit="%"/>
                </div>
                <div style={{fontWeight:700,fontSize:11,color:C.textSoft,textTransform:"uppercase",marginBottom:8}}>Renal / Articular</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
                  <InpNum label="Ácido Úrico"  value={met.acido_urico}              onChange={v=>updM("acido_urico",v)}              unit="mg/dL"/>
                  <InpNum label="Creatinina"   value={met.creatinina}               onChange={v=>updM("creatinina",v)}               unit="mg/dL"/>
                  <InpNum label="Circ. Abd."   value={met.circunferencia_abdominal} onChange={v=>updM("circunferencia_abdominal",v)} unit="cm"/>
                </div>
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                  <Field label="Tipo Consulta" value={met.tipo_consulta} onChange={v=>updM("tipo_consulta",v)} type="select" options={["Asistencial","Ocupacional"]}/>
                  <Field label="Dx Metabólico preliminar" value={met.dx_metabolico} onChange={v=>updM("dx_metabolico",v)} type="select"
                    options={["Normal","Sobrepeso","Obesidad grado I","Obesidad grado II","Síndrome metabólico","Diabetes mellitus tipo 2","Prediabetes","Hipertensión arterial","Dislipidemia mixta","Hipercolesterolemia","Hipertrigliceridemia"]}/>
                </div>
                {(()=>{
                  const s=calcSemaforo(reg.pa,reg.peso,reg.talla,met);
                  return(
                    <div style={{marginTop:14,display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:riskBg(s),border:`1px solid ${riskColor(s)}`,borderRadius:10}}>
                      <span style={{fontSize:20}}>{s==="Rojo"?"🔴":s==="Amarillo"?"🟡":"🟢"}</span>
                      <div>
                        <div style={{fontWeight:800,color:riskColor(s),fontSize:13}}>Semáforo Metabólico: {s}</div>
                        <div style={{fontSize:11,color:C.textSoft}}>Se enviará al Dashboard MEDWEB al guardar</div>
                      </div>
                    </div>
                  );
                })()}
              </Card>
            )}

            {/* NAVEGACIÓN */}
            <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center",paddingBottom:24,flexWrap:"wrap"}}>
              <div style={{display:"flex",gap:8}}>
                {paso>1&&<Btn label="← Anterior" onClick={()=>setPaso(p=>p-1)} color={C.gray}/>}
                {paso<5&&<Btn label="Siguiente →" onClick={()=>setPaso(p=>p+1)} color={C.blue}/>}
              </div>
              <div style={{display:"flex",gap:8}}>
                <Btn label="💾 Guardar" onClick={()=>setConfirmando(true)} color={C.teal}/>
                <Btn label="🔗 Guardar y Enviar a MEDWEB" onClick={async()=>{await guardarRegistro();await enviarAMedweb();}} color={C.green}/>
              </div>
            </div>
          </div>
        )}
      </div>

      <div style={{textAlign:"center",padding:"12px 0",color:C.textSoft,fontSize:11,borderTop:`1px solid ${C.border}`}}>
        <strong style={{color:C.blue}}>PANACEA ENFERMERÍA</strong> · Panacea Medicina Ocupacional · panaceamedocup@gmail.com · Arequipa, Perú
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
